# Publishes this folder to GitHub Pages on every push to main.
# One-time setup in the repo UI: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy Talking Cat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # upload-pages-artifact drops dotfiles from v4 onwards; .nojekyll has to
      # be asked for by name or it stops being published. (.git and .github are
      # excluded regardless of this flag.)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v5
